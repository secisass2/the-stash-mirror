<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Stash</title>
<style>
  :root{--bg:#0a1410;--card:#10201a;--border:#23362c;--fg:#e7f4ec;--muted:#8aa597;--primary:#3ee08a;--primary-fg:#06140d;--accent:#16271f}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  a{color:inherit;text-decoration:none}
  header{position:sticky;top:0;z-index:40;background:rgba(10,20,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .row{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
  .logo{display:grid;place-items:center;height:34px;width:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#1c7a4a);color:var(--primary-fg);font-weight:800}
  .title{font-weight:800;font-size:15px}.sub{font-size:11px;color:var(--muted)}
  input.search{margin-left:auto;width:230px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--fg);padding:8px 14px;font-size:13px;outline:none}
  input.search:focus{box-shadow:0 0 0 2px var(--primary)}
  .chip{cursor:pointer;border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;background:var(--card);color:var(--fg);white-space:nowrap}
  .chip.active{background:var(--primary);color:var(--primary-fg)}
  .cats{max-width:1200px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 18px 12px}
  main{max-width:1200px;margin:0 auto;padding:18px}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:820px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(min-width:1080px){.grid{grid-template-columns:repeat(5,1fr)}}
  .tile{position:relative;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;transition:.15s}
  .tile:hover{transform:translateY(-2px);border-color:var(--primary)}
  .art{aspect-ratio:4/3;display:grid;place-items:center;font-size:34px;font-weight:900;color:#fff}
  .name{border-top:1px solid var(--border);padding:7px 8px;font-size:11px;font-weight:600;line-height:1.2;height:42px;overflow:hidden}
  .fav{position:absolute;top:6px;right:6px;height:28px;width:28px;border:0;border-radius:999px;cursor:pointer;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
  .fav.on{background:var(--primary);color:var(--primary-fg)}
  .more{display:block;margin:24px auto 0;border:1px solid var(--border);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 18px;font-size:13px;cursor:pointer}
  .player{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:#000}
  .player.open{display:flex}
  .pbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--border)}
  .pbar button,.pbar a{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
  iframe{flex:1;border:0;width:100%;background:#000}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="logo">S</div>
    <div><div class="title">The Stash</div><div class="sub" id="count"></div></div>
    <input class="search" id="search" placeholder="Search games…"/>
    <button class="chip" id="favBtn">♥ Favorites</button>
  </div>
  <div class="cats" id="cats"></div>
</header>
<main>
  <div class="meta"><span id="heading"></span><span id="results"></span></div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" style="display:none">Load more</button>
  <p class="empty" id="empty" style="display:none">No matches.</p>
</main>

<div class="player" id="player">
  <div class="pbar">
    <button id="back">← Library</button>
    <strong id="ptitle" style="font-size:13px"></strong>
    <a id="newtab" target="_blank" style="margin-left:auto">New tab</a>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

 {id:'sports',label:'⚽ Sports',m:t=>has(t,['ball','soccer','football','basket','tennis','golf','hockey','baseball','bowl','pool','box','skate','surf','fish'])},
 {id:'puzzle',label:'🧩 Puzzle',m:t=>has(t,['puzzle','sudoku','2048','chess','sokoban','tetris','match','jewel','candy','word','crossword','solitaire','mahjong','block'])},
 {id:'platformer',label:'🍄 Platformer',m:t=>has(t,['mario','sonic','jump','parkour','climb','kirby','platform','geometry','celeste','metroid','kaizo'])},
 {id:'strategy',label:'♟️ Strategy',m:t=>has(t,['tower','td','defense','kingdom','idle','tycoon','clicker','sim','build','civ','strategy','empire'])},
 {id:'io',label:'🌐 .io',m:t=>/io$/.test(t.replace(/\s+/g,''))||has(t,['agar','slither','hole.io'])},
 {id:'adventure',label:'🗺️ Adventure',m:t=>has(t,['zelda','pokemon','rpg','quest','adventure','story','knight','dungeon','fantasy','legend','saga'])},
 {id:'classic',label:'👾 Retro',m:t=>has(t,['nes','snes','gba','n64','gameboy','arcade','retro','atari','sega','genesis','ds'])},
 {id:'apps',label:'📱 Apps',m:t=>has(t,['app','calculator','calc','notepad','notes','draw','paint','editor','browser','player','viewer','converter','translator','clock','timer','maker','generator','tool'])},
];
let favs=JSON.parse(localStorage.getItem('stash:favs')||'[]');
let q='',cat='all',showFav=false,limit=120;
const $=id=>document.getElementById(id);
$('count').textContent=LIB.length.toLocaleString()+' titles';

const catsEl=$('cats');
CATS.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c.id==='all'?' active':'');b.textContent=c.label;b.onclick=()=>{cat=c.id;limit=120;[...catsEl.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');render();};catsEl.appendChild(b);});
$('search').oninput=e=>{q=e.target.value.toLowerCase().trim();limit=120;render();};
$('favBtn').onclick=()=>{showFav=!showFav;$('favBtn').classList.toggle('active',showFav);limit=120;render();};
$('more').onclick=()=>{limit+=240;render();};
$('back').onclick=closePlayer;

function hue(s){const seed=(s.charCodeAt(0)+s.charCodeAt(s.length-1))*7;return 130+(seed%50);}
function filtered(){const c=CATS.find(x=>x.id===cat);return LIB.filter(i=>{const t=i.t.toLowerCase();if(showFav&&!favs.includes(i.s))return false;if(cat!=='all'&&!c.m(t))return false;if(q&&!t.includes(q))return false;return true;});}

function render(){
 const arr=filtered();const vis=arr.slice(0,limit);const g=$('grid');g.innerHTML='';
 $('results').textContent=arr.length.toLocaleString()+' results';
 $('heading').textContent=showFav?'★ Favorites':CATS.find(x=>x.id===cat).label;
 $('empty').style.display=arr.length?'none':'block';
 vis.forEach(i=>{
   const t=document.createElement('div');t.className='tile';
   const h=hue(i.s);
   t.innerHTML=`<div class="art" style="background:linear-gradient(135deg,hsl(${h},60%,45%),hsl(${(h+20)%360},40%,15%))">${(i.t[0]||'?').toUpperCase()}</div><div class="name">${i.t.replace(/</g,'&lt;')}</div>`;
   const fb=document.createElement('button');fb.className='fav'+(favs.includes(i.s)?' on':'');fb.textContent='♥';
   fb.onclick=e=>{e.stopPropagation();favs=favs.includes(i.s)?favs.filter(s=>s!==i.s):[i.s,...favs];localStorage.setItem('stash:favs',JSON.stringify(favs));render();};
   t.appendChild(fb);
   t.onclick=()=>openGame(i);
   g.appendChild(t);
 });
 $('more').style.display=vis.length<arr.length?'block':'none';
}

function openGame(i){$('ptitle').textContent=i.t;$('frame').src=CDN(i.s);$('newtab').href=CDN(i.s);$('player').classList.add('open');}
function closePlayer(){$('player').classList.remove('open');$('frame').src='about:blank';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();});
render();
</script>
</body>
</html>
